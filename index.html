<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meja Kerja</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meja Kerja">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0a;--panel:#141414;--ink:#f5f5f5;--mute:#9b9b9b;--line:#2a2a2a;--hover:#1c1c1c;
  --acc:#ffcc00;--on-acc:#000;--red:#ff5c4d;--amber:#ffcc00;--green:#5ed38a;
  --s1:#8a8a8a;--s2:#5aa9ff;--s3:#2fc6b8;--s4:#ff8a3d;--s5:#b48cff;--s6:#5ed38a;
  --side:#000;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none;display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.shell{display:grid;grid-template-columns:208px 1fr;min-height:100vh}

/* sidebar */
.side{background:var(--side);color:#aab4c5;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;color:#fff;font-weight:700;font-size:14px}
.brand span{width:26px;height:26px;border-radius:7px;background:var(--acc);display:grid;place-items:center;color:#000}
.nav{display:grid;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;text-align:left;padding:7px 10px;border-radius:6px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#e6eaf2}
.nav button.on{background:#1a1a1a;color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nav button.on svg{color:var(--acc)}
.side .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding:10px 2px 0;display:grid;gap:4px;font-size:12px}
.side .foot button{display:flex;align-items:center;gap:8px;border:0;background:none;color:#aab4c5;padding:6px 8px;border-radius:6px;text-align:left}
.side .foot button:hover{background:rgba(255,255,255,.06);color:#e6eaf2}
.side .foot small{color:#7f8aa0;padding:0 8px 4px;overflow-wrap:anywhere}

/* topbar + main */
.main{min-width:0;display:flex;flex-direction:column}
.net{background:#b54708;color:#fff;text-align:center;padding:5px 12px;font-size:12px}
.bar{display:flex;align-items:center;gap:10px;padding:0 20px;height:52px;border-bottom:2px solid var(--acc);background:var(--panel);position:sticky;top:0;z-index:5}
.bar h1{font-size:15px;font-weight:700;margin-right:auto}
.menu{display:none;border:1px solid var(--line);background:none;border-radius:6px;padding:6px}
.search{position:relative;width:240px}
.search svg{position:absolute;left:9px;top:8px;color:var(--mute)}
.search input{padding-left:30px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;line-height:1.4}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
#view{padding:16px 20px 32px}

/* generic */
.hd{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.hd b{font-size:15px;font-weight:700}
.hd small{margin-left:auto;color:var(--mute);font-size:12px}
.neg{color:var(--red)}
.stat.warn b{color:var(--red)}
.stat.warn svg{color:var(--red)}
.ph small{color:var(--mute);font-size:12px}
.ag{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.ag .d{border:1px solid var(--line);border-radius:6px;text-align:center;padding:4px 0 3px}
.ag .d small{display:block;color:var(--mute);font-size:11px}
.ag .d b{display:block;font-size:13px;font-weight:700}
.ag .d i{display:block;font-style:normal;font-size:11px;font-weight:700;min-height:14px}
.ag .d.we{background:var(--hover)}
.ag .d.has{background:var(--acc);border-color:var(--acc);color:#000}
.ag .d.has small{color:#000}
.ag .d.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.dash{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;align-items:start}
.stack{display:grid;gap:12px}
.seg{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:4px 0 10px}
.seg span{background:var(--c)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.lg div{display:flex;align-items:center;gap:7px;font-size:12.5px}
.lg i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.lg em{margin-left:auto;font-style:normal;color:var(--mute)}
.fin{display:flex;justify-content:space-between;padding:3px 0}
.fin span{color:var(--mute)}
.fin b{font-weight:700}
.fb{margin:8px 0 4px}
.dl .ago{color:var(--mute);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel h2{font-size:13px;font-weight:700;margin-bottom:8px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.stat{display:flex;gap:10px;align-items:center;padding:12px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat svg{color:var(--acc)}
.stat b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip{padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.soon{background:var(--acc);color:#000;border-color:transparent}
.chip.late{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);border-color:transparent}
.bar2{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.bar2 span{display:block;height:100%;background:var(--c,var(--acc));border-radius:5px}
.ph{display:flex;align-items:center;margin-bottom:6px}
.ph h2{margin:0;flex:1}
.lnk{border:0;background:none;color:var(--acc);font-size:12px;font-weight:600;padding:2px 4px;border-radius:4px}
.lnk:hover{text-decoration:underline}
.dl{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.dls .dl:first-child{border-top:0}
.dl:hover{background:var(--hover)}
.dl .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .t b{font-weight:600}
.dl .t small{color:var(--mute);font-size:12px;margin-left:8px}
.empty{color:var(--mute);padding:10px 4px;font-size:12.5px}

/* board */
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.col{flex:0 0 250px;background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:8px;padding:8px;min-height:120px}
.col.over{outline:2px dashed var(--acc);outline-offset:-2px}
.col h3{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;padding:2px 4px 8px}
.col h3 i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.col h3 em{margin-left:auto;font-style:normal;font-weight:600;color:var(--mute);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:grab}
.card:hover{border-color:var(--acc);border-left-color:var(--c)}
.card b{display:block;font-weight:600}
.card small{color:var(--mute);font-size:12px}
.meta{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0}
.card .bar2{margin-top:7px}

/* table */
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools select{width:auto}
.tbl{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:600px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 12px;background:var(--hover);border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr[data-open]{cursor:pointer}
tr[data-open]:hover td{background:var(--hover)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td small{display:block;color:var(--mute);font-size:12px}

/* modal */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(600px,94vw);padding:0;max-height:92vh}
dialog::backdrop{background:rgba(8,12,22,.55)}
.dh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:15px;flex:1}
.x{border:0;background:none;color:var(--mute);padding:3px;border-radius:5px}
.x:hover{background:var(--hover)}
form{display:grid;gap:10px;padding:16px}
label{display:grid;gap:4px;font-weight:600;font-size:12px}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;width:100%;font-weight:400;font-size:13px}
textarea{min-height:56px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sub{border-top:1px solid var(--line);padding-top:10px}
.sub h3{font-size:12.5px;margin-bottom:4px}
.item{display:flex;gap:8px;align-items:center;padding:2px 0}
.item input[type=checkbox]{width:auto}
.item .x{margin-left:auto}
.item.done span{text-decoration:line-through;color:var(--mute)}
.add{display:flex;gap:6px;margin-top:6px}
.lk a{display:flex;gap:6px;align-items:center;color:var(--acc);overflow-wrap:anywhere;font-size:12px}
.actions{display:flex;gap:8px;justify-content:flex-end}
.it{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;display:grid;gap:6px}
.it .r1{display:grid;grid-template-columns:1fr 130px auto;gap:6px;align-items:center}
.it .r2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.it .r2 label{font-weight:500;color:var(--mute);font-size:11px}
.it .r3{text-align:right;font-size:12px;color:var(--mute)}
.it .r3 b{color:var(--ink);font-size:13px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;align-items:end}
.calc .tot{text-align:right;font-size:12px;color:var(--mute);line-height:1.5}
.calc .tot b{display:block;color:var(--ink);font-size:15px}
input[readonly]{background:var(--hover)}

/* auth */
#auth{max-width:340px;margin:12vh auto;padding:22px;display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#auth h1{font-size:17px}

@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:230px;z-index:20;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu{display:block}
  .bar{padding:8px 12px;height:auto;flex-wrap:wrap}
  .search{order:5;width:100%}
  #view{padding:12px}
  .dash,.row,.row3{grid-template-columns:1fr}
  .ag{grid-template-columns:repeat(7,minmax(0,1fr))}
  .dl{grid-template-columns:84px minmax(0,1fr)}
  .dl .st{display:none}
  .strip{grid-template-columns:1fr 1fr}
  .stat:nth-child(odd){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>

<form id="auth" hidden>
  <h1>Masuk ke Meja Kerja</h1>
  <p id="cfg" hidden style="color:var(--red);font-size:13px">Penyimpanan cloud belum dikonfigurasi. Atur Environment Variables CLOUD_URL dan CLOUD_KEY di Vercel, lalu deploy ulang.</p>
  <label>Email<input id="em" type="email" required autocomplete="username"></label>
  <label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn primary" style="justify-content:center">Masuk</button>
</form>

<div class="shell" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><span data-ic="palette" data-s="16"></span>Meja Kerja</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <small id="who"></small>
      <button id="inst" hidden><span data-ic="download" data-s="16"></span>Pasang aplikasi</button>
      <button id="out"><span data-ic="logout" data-s="16"></span>Keluar</button>
    </div>
  </aside>
  <div class="main">
    <div id="net" class="net" hidden>Kamu sedang offline. Data tidak bisa dimuat atau disimpan.</div>
    <header class="bar">
      <button class="menu" id="menu" aria-label="Buka menu"><span data-ic="menu" data-s="18"></span></button>
      <h1 id="title"></h1>
      <div class="search"><span data-ic="search" data-s="16"></span><input id="q" type="search" placeholder="Cari judul atau klien" aria-label="Cari proyek"></div>
      <button class="btn primary" id="new"><span data-ic="plus" data-s="16"></span>Proyek baru</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg">
  <div class="dh"><h2 id="dt">Proyek</h2><button type="button" class="x" id="close" aria-label="Tutup"><span data-ic="x"></span></button></div>
  <form id="f" method="dialog">
    <label>Judul<input name="title" required></label>
    <div class="row">
      <label>Klien<input name="client"></label>
      <label>Tahap<select name="status"></select></label>
    </div>
    <div class="row3">
      <label>Deadline<input name="deadline" type="date"></label>
      <label>Nilai (Rp)<input name="value" type="number" min="0" step="1000"></label>
      <label>Dibayar (Rp)<input name="paid" type="number" min="0" step="1000"></label>
    </div>
    <div class="row">
      <label>Brief<textarea name="brief"></textarea></label>
      <label>Link file (satu per baris)<textarea name="links" placeholder="https://..."></textarea></label>
    </div>
    <div class="lk" id="lk"></div>
    <div class="sub">
      <h3>Detail pekerjaan</h3>
      <div id="il"></div>
      <div class="add"><button type="button" class="btn" id="ia"><span data-ic="plus" data-s="14"></span>Tambah item</button></div>
      <div class="calc">
        <label>Biaya desain (Rp)<input name="design_fee" type="number" min="0" step="1000"></label>
        <div class="tot">Subtotal item: <span id="isum">Rp 0</span><b id="itot">Rp 0</b></div>
      </div>
    </div>
    <datalist id="jenis"><option>Banner</option><option>Spanduk</option><option>X-Banner</option><option>Roll Banner</option><option>Stiker</option><option>Backdrop</option><option>Brosur</option><option>Kartu nama</option><option>Logo</option></datalist>
    <div class="row subs">
    <div class="sub">
      <h3>Checklist</h3><div id="tl"></div>
      <div class="add"><input id="tn" placeholder="Tambah langkah, mis. Sketsa awal"><button type="button" class="btn" id="ta">Tambah</button></div>
    </div>
    <div class="sub">
      <h3>Revisi</h3><div id="rl"></div>
      <div class="add"><input id="rn" placeholder="Catatan feedback ronde berikutnya"><button type="button" class="btn" id="ra">Catat revisi</button></div>
    </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="del" hidden><span data-ic="trash" data-s="16"></span>Hapus</button>
      <button type="button" class="btn" id="cancel">Batal</button>
      <button class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const I = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  board:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v11"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 13h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  palette:'<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 22a10 10 0 1 1 10-10c0 2.5-2 3-4 3h-2a2 2 0 0 0-1.5 3.3c.9 1 .2 3.7-2.5 3.7z"/>'
};
const ic = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const paintIcons = () => document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = ic(e.dataset.ic, +e.dataset.s || 16); });

const COLS = [['ide','Ide','--s1'],['brief','Brief','--s2'],['kerja','Dikerjakan','--s3'],['revisi','Revisi','--s4'],['approval','Menunggu approval','--s5'],['selesai','Selesai','--s6']];
const STAGE = Object.fromEntries(COLS.map(c => [c[0], c]));
const VIEWS = { ringkasan:['Ringkasan','dash'], board:['Board','board'], proyek:['Semua proyek','list'], keuangan:['Keuangan','wallet'] };
const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + (+n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => crypto.randomUUID();
let sb = null;
// Kredensial dibaca dari /api/config (Environment Variables di Vercel), bukan ditulis di file ini.
async function initCloud() {
  try {
    const r = await fetch('/api/config', { cache: 'no-store' });
    if (!r.ok) return false;
    const c = await r.json();
    sb = supabase.createClient(c.url, c.key);
    return true;
  } catch { return false; }
}
let projects = [], cur = null, view = 'ringkasan', q = '', fs = '';

const db = {
  async load() {
    const { data, error } = await sb.from('projects').select('*').order('created_at', { ascending: false });
    if (error) throw error; return data;
  },
  async save(p) {
    const { data, error } = await sb.from('projects').upsert(p).select().single();
    if (error) throw error;
    const i = projects.findIndex(x => x.id === data.id);
    i < 0 ? projects.unshift(data) : projects[i] = data;
  },
  async del(id) {
    const { error } = await sb.from('projects').delete().eq('id', id);
    if (error) throw error;
    projects = projects.filter(x => x.id !== id);
  }
};

// ---- helpers ----
const daysLeft = d => d ? Math.round((new Date(d) - new Date().setHours(0,0,0,0)) / 864e5) : null;
const visible = () => projects.filter(p => !q || (p.title + ' ' + (p.client || '')).toLowerCase().includes(q));
const badge = p => `<span class="badge" style="--c:var(${STAGE[p.status][2]})">${STAGE[p.status][1]}</span>`;
const taskInfo = p => p.tasks.length ? `${p.tasks.filter(t => t.done).length}/${p.tasks.length}` : '-';
function dlChip(p) {
  const d = daysLeft(p.deadline);
  if (d === null) return '';
  if (d < 0) return `<span class="chip late">Telat ${-d} hari</span>`;
  if (d <= 3) return `<span class="chip soon">${d === 0 ? 'Hari ini' : d + ' hari lagi'}</span>`;
  return `<span class="chip">${new Date(p.deadline).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span>`;
}

// ---- views ----
const ago = iso => { const d = Math.round((new Date().setHours(0,0,0,0) - new Date(iso).setHours(0,0,0,0)) / 864e5); return d <= 0 ? 'hari ini' : d + ' hari lalu'; };

function vRingkasan() {
  const active = projects.filter(p => p.status !== 'selesai');
  const dl = p => daysLeft(p.deadline);
  const late = active.filter(p => dl(p) !== null && dl(p) < 0).length;
  const urgent = active.filter(p => dl(p) !== null && dl(p) >= 0 && dl(p) <= 3).length;
  const soon = active.filter(p => dl(p) !== null && dl(p) >= 0 && dl(p) <= 7).length;
  const wait = projects.filter(p => p.status === 'approval').length;
  const run = projects.filter(p => p.status !== 'ide');
  const tv = run.reduce((s, p) => s + p.value, 0), tp = run.reduce((s, p) => s + p.paid, 0);
  const owed = run.reduce((s, p) => s + Math.max(0, p.value - p.paid), 0);
  const pct = tv ? Math.min(100, Math.round(tp / tv * 100)) : 0;

  const head = !projects.length ? 'Belum ada proyek. Klik Proyek baru untuk memulai.'
    : (late || urgent) ? [late ? `<span class="neg">${late} proyek telat</span>` : '', urgent ? `${urgent} deadline dalam 3 hari` : ''].filter(Boolean).join(', ')
    : 'Tidak ada deadline mendesak';
  const today = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const stats = [['folder', active.length, 'Proyek aktif', ''], ['clock', soon, 'Deadline 7 hari', ''],
    ['alert', late, 'Telat', late ? 'warn' : ''], ['send', wait, 'Menunggu approval', ''], ['wallet', rp(owed), 'Belum dibayar', '']];

  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
  const byDay = days.map(() => []);
  active.forEach(p => { const n = dl(p); if (n !== null && n >= 0 && n < 14) byDay[n].push(p.title); });
  const fmt = d => d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

  const next = visible().filter(p => p.status !== 'selesai' && p.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline)).slice(0, 8);
  const revs = projects.flatMap(p => p.revisions.map(r => ({ p, r }))).filter(x => x.r.date)
    .sort((a, b) => b.r.date.localeCompare(a.r.date)).slice(0, 4);
  const cnt = COLS.map(c => projects.filter(p => p.status === c[0]).length);

  return `<div class="hd"><b>${head}</b><small>${today}</small></div>
  <div class="strip">${stats.map(s => `<div class="stat ${s[3]}">${ic(s[0])}<div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('')}</div>
  <div class="panel" style="margin-bottom:12px"><div class="ph"><h2>14 hari ke depan</h2><small>${fmt(days[0])} - ${fmt(days[13])}</small></div>
    <div class="ag">${days.map((d, i) => { const n = byDay[i].length;
      return `<div class="d${n ? ' has' : ''}${i === 0 ? ' today' : ''}${[0, 6].includes(d.getDay()) ? ' we' : ''}" title="${esc(byDay[i].join(', ') || 'Tidak ada deadline')}"><small>${d.toLocaleDateString('id-ID', { weekday: 'short' })}</small><b>${d.getDate()}</b><i>${n || ''}</i></div>`; }).join('')}</div></div>
  <div class="dash">
    <div class="panel"><div class="ph"><h2>Deadline terdekat</h2><button class="lnk" data-go="proyek">Lihat semua</button></div>
      <div class="dls">${next.map(p =>
      `<div class="dl" data-open="${p.id}" tabindex="0"><span>${dlChip(p)}</span><span class="t"><b>${esc(p.title)}</b>${p.client ? `<small>${esc(p.client)}</small>` : ''}</span><span class="st">${badge(p)}</span></div>`).join('') || '<div class="empty">Belum ada proyek dengan deadline.</div>'}</div></div>
    <div class="stack">
      <div class="panel"><h2>Pipeline</h2>
        <div class="seg">${COLS.map((c, i) => cnt[i] ? `<span style="flex:${cnt[i]};--c:var(${c[2]})"></span>` : '').join('')}</div>
        <div class="lg">${COLS.map((c, i) => `<div style="--c:var(${c[2]})"><i></i>${c[1]}<em>${cnt[i]}</em></div>`).join('')}</div></div>
      <div class="panel"><h2>Keuangan proyek berjalan</h2>
        <div class="fin"><span>Total nilai</span><b>${rp(tv)}</b></div>
        <div class="fin"><span>Sudah dibayar</span><b>${rp(tp)}</b></div>
        <div class="fin"><span>Belum dibayar</span><b>${rp(owed)}</b></div>
        <div class="bar2 fb"><span style="width:${pct}%"></span></div><small style="color:var(--mute)">${pct}% terbayar</small></div>
      <div class="panel"><h2>Revisi terbaru</h2>
        <div class="dls">${revs.map(x =>
        `<div class="dl" data-open="${x.p.id}" tabindex="0"><span><span class="chip">Ronde ${x.r.round}</span></span><span class="t"><b>${esc(x.p.title)}</b><small>${esc(x.r.note)}</small></span><span class="st ago">${ago(x.r.date)}</span></div>`).join('') || '<div class="empty">Belum ada revisi tercatat.</div>'}</div></div>
    </div>
  </div>`;
}

function vBoard() {
  const list = visible();
  return `<div class="board">${COLS.map(([k, label, c]) => {
    const items = list.filter(p => p.status === k).sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
    return `<div class="col" data-col="${k}" style="--c:var(${c})"><h3><i></i>${label}<em>${items.length}</em></h3>${items.map(p =>
      `<div class="card" draggable="true" data-open="${p.id}" tabindex="0"><b>${esc(p.title)}</b>${p.client ? `<small>${esc(p.client)}</small>` : ''}
       <div class="meta">${dlChip(p)}${p.revisions.length ? `<span class="chip">Revisi ${p.revisions.length}</span>` : ''}${p.value ? `<span class="chip">${rp(p.value)}</span>` : ''}</div>
       ${p.tasks.length ? `<div class="bar2" style="--c:var(--acc)"><span style="width:${p.tasks.filter(t => t.done).length / p.tasks.length * 100}%"></span></div>` : ''}</div>`).join('') || '<div class="empty">Seret proyek ke sini</div>'}</div>`;
  }).join('')}</div>`;
}

function vProyek() {
  const list = visible().filter(p => !fs || p.status === fs)
    .sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  return `<div class="tools"><select id="fs" aria-label="Filter tahap"><option value="">Semua tahap</option>${COLS.map(c => `<option value="${c[0]}" ${fs === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select></div>
  <div class="panel tbl"><table><thead><tr><th>Proyek</th><th>Tahap</th><th>Deadline</th><th>Checklist</th><th class="n">Nilai</th></tr></thead><tbody>${list.map(p =>
    `<tr data-open="${p.id}" tabindex="0"><td><b>${esc(p.title)}</b><small>${esc(p.client || 'Tanpa klien')}</small></td><td>${badge(p)}</td><td>${dlChip(p) || '-'}</td><td>${taskInfo(p)}</td><td class="n">${rp(p.value)}</td></tr>`).join('')
    || '<tr><td colspan="5" class="empty">Belum ada proyek. Klik Proyek baru untuk memulai.</td></tr>'}</tbody></table></div>`;
}

function vKeuangan() {
  const list = visible().filter(p => p.value > 0);
  const tv = list.reduce((s, p) => s + p.value, 0), tp = list.reduce((s, p) => s + p.paid, 0);
  const stats = [['wallet', rp(tv), 'Total nilai proyek'], ['send', rp(tp), 'Sudah dibayar'], ['clock', rp(Math.max(0, tv - tp)), 'Belum dibayar']];
  return `<div class="strip">${stats.map(s => `<div class="stat">${ic(s[0])}<div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('')}</div>
  <div class="panel tbl"><table><thead><tr><th>Proyek</th><th class="n">Nilai</th><th class="n">Dibayar</th><th class="n">Sisa</th><th>Pelunasan</th></tr></thead><tbody>${list.map(p =>
    `<tr data-open="${p.id}" tabindex="0"><td><b>${esc(p.title)}</b><small>${esc(p.client || 'Tanpa klien')}</small></td><td class="n">${rp(p.value)}</td><td class="n">${rp(p.paid)}</td><td class="n">${rp(Math.max(0, p.value - p.paid))}</td>
     <td style="min-width:120px"><div class="bar2"><span style="width:${Math.min(100, p.paid / p.value * 100)}%"></span></div></td></tr>`).join('')
    || '<tr><td colspan="5" class="empty">Isi nilai proyek di detail proyek untuk melihat rekap keuangan.</td></tr>'}</tbody></table></div>`;
}

const RENDER = { ringkasan: vRingkasan, board: vBoard, proyek: vProyek, keuangan: vKeuangan };
function render() {
  $('#title').textContent = VIEWS[view][0];
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button data-v="${k}" class="${k === view ? 'on' : ''}">${ic(v[1])}${v[0]}</button>`).join('');
  $('#view').innerHTML = RENDER[view]();
}

// ---- events: nav, search, open, drag & drop ----
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { view = b.dataset.v; $('#side').classList.remove('open'); render(); } });
$('#menu').onclick = () => $('#side').classList.toggle('open');
$('#q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
const vw = $('#view');
vw.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { view = g.dataset.go; render(); return; } const o = e.target.closest('[data-open]'); if (o) openModal(projects.find(p => p.id === o.dataset.open)); });
vw.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.closest?.('[data-open]')?.click(); });
vw.addEventListener('change', e => { if (e.target.id === 'fs') { fs = e.target.value; render(); } });
vw.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (c) e.dataTransfer.setData('text/plain', c.dataset.open); });
vw.addEventListener('dragover', e => { const c = e.target.closest('.col'); if (c) { e.preventDefault(); c.classList.add('over'); } });
vw.addEventListener('dragleave', e => e.target.closest('.col')?.classList.remove('over'));
vw.addEventListener('drop', async e => {
  const col = e.target.closest('.col'); if (!col) return;
  e.preventDefault();
  const p = projects.find(x => x.id === e.dataTransfer.getData('text/plain'));
  if (p && p.status !== col.dataset.col) { try { await db.save({ ...p, status: col.dataset.col }); } catch (err) { alert(err.message); } }
  render();
});

// ---- modal ----
const dlg = $('#dlg'), f = $('#f');
f.status.innerHTML = COLS.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');

function renderSub() {
  $('#tl').innerHTML = cur.tasks.map((t, i) =>
    `<div class="item ${t.done ? 'done' : ''}"><input type="checkbox" data-t="${i}" ${t.done ? 'checked' : ''} aria-label="Selesai"><span>${esc(t.title)}</span><button type="button" class="x" data-dt="${i}" aria-label="Hapus langkah">${ic('x', 16)}</button></div>`).join('')
    || '<div class="empty">Belum ada langkah.</div>';
  $('#rl').innerHTML = cur.revisions.map(r => `<div class="item"><b>Ronde ${r.round}</b><span>${esc(r.note)}</span></div>`).join('')
    || '<div class="empty">Belum ada revisi.</div>';
  $('#lk').innerHTML = (f.links.value.match(/https?:\/\/\S+/g) || [])
    .map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${ic('link', 14)}${esc(u)}</a>`).join('');
}

// ---- detail pekerjaan (item + biaya desain) ----
// Item ukuran: (panjang cm x lebar cm / 10.000) = m2, dikali jumlah, dikali harga per m2. Item satuan: jumlah x harga.
const itemSub = i => Math.round((i.mode === 'unit' ? 1 : (+i.w || 0) * (+i.h || 0) / 1e4) * (+i.qty || 0) * (+i.price || 0));
const itemArea = i => (+i.w || 0) * (+i.h || 0) / 1e4;
function totals() {
  const sum = cur.items.reduce((a, i) => a + itemSub(i), 0);
  const total = sum + (+f.design_fee.value || 0);
  $('#isum').textContent = rp(sum); $('#itot').textContent = 'Total ' + rp(total);
  const auto = cur.items.length > 0 || (+f.design_fee.value || 0) > 0;
  f.value.readOnly = auto;
  if (auto) f.value.value = total;
  return total;
}
function renderItems() {
  $('#il').innerHTML = cur.items.map((i, n) => {
    const area = i.mode !== 'unit';
    return `<div class="it" data-n="${n}">
      <div class="r1"><input data-k="name" list="jenis" placeholder="Jenis pekerjaan, mis. Banner" value="${esc(i.name)}" aria-label="Jenis pekerjaan">
        <select data-k="mode" aria-label="Cara hitung"><option value="area" ${area ? 'selected' : ''}>Ukuran (m²)</option><option value="unit" ${area ? '' : 'selected'}>Satuan</option></select>
        <button type="button" class="x" data-di="${n}" aria-label="Hapus item">${ic('x', 16)}</button></div>
      <div class="r2">
        ${area ? `<label>Panjang (cm)<input data-k="w" type="number" min="0" value="${i.w ?? ''}"></label><label>Lebar (cm)<input data-k="h" type="number" min="0" value="${i.h ?? ''}"></label>` : ''}
        <label>Jumlah<input data-k="qty" type="number" min="0" value="${i.qty ?? 1}"></label>
        <label>${area ? 'Harga per m² (Rp)' : 'Harga satuan (Rp)'}<input data-k="price" type="number" min="0" step="500" value="${i.price ?? ''}"></label>
      </div>
      <div class="r3">${area ? `<span data-a>${itemArea(i).toLocaleString('id-ID')} m² × ${+i.qty || 0} × ${rp(i.price)} = </span>` : ''}<b data-s>${rp(itemSub(i))}</b></div></div>`;
  }).join('');
  totals();
}
$('#ia').onclick = () => { cur.items.push({ id: uid(), name: '', mode: 'area', w: '', h: '', qty: 1, price: '' }); renderItems(); };
$('#il').addEventListener('input', e => {
  const k = e.target.dataset.k, row = e.target.closest('[data-n]'); if (!k || !row) return;
  const i = cur.items[+row.dataset.n]; i[k] = e.target.value;
  if (k === 'mode') { renderItems(); return; }
  const a = row.querySelector('[data-a]');
  if (a) a.textContent = `${itemArea(i).toLocaleString('id-ID')} m² × ${+i.qty || 0} × ${rp(i.price)} = `;
  row.querySelector('[data-s]').textContent = rp(itemSub(i)); totals();
});
$('#il').addEventListener('click', e => { const d = e.target.closest('[data-di]'); if (d) { cur.items.splice(+d.dataset.di, 1); renderItems(); } });
f.design_fee.addEventListener('input', totals);

function openModal(p) {
  cur = structuredClone(p || { title: '', client: '', status: 'ide', deadline: null, value: 0, paid: 0, brief: '', links: '', tasks: [], revisions: [], items: [], design_fee: 0 });
  cur.items ||= []; cur.design_fee ||= 0;
  $('#dt').textContent = p ? 'Edit proyek' : 'Proyek baru';
  for (const k of ['title', 'client', 'status', 'deadline', 'value', 'paid', 'brief', 'links', 'design_fee']) f[k].value = cur[k] ?? '';
  $('#del').hidden = !p;
  renderSub(); renderItems(); dlg.showModal();
}
$('#new').onclick = () => openModal();
$('#cancel').onclick = $('#close').onclick = () => dlg.close();
f.links.addEventListener('input', renderSub);
$('#ta').onclick = () => { const v = $('#tn').value.trim(); if (v) { cur.tasks.push({ id: uid(), title: v, done: false }); $('#tn').value = ''; renderSub(); } };
$('#ra').onclick = () => { const v = $('#rn').value.trim(); if (v) { cur.revisions.push({ round: cur.revisions.length + 1, note: v, date: new Date().toISOString() }); $('#rn').value = ''; renderSub(); } };
dlg.addEventListener('click', e => {
  if (e.target.dataset.t !== undefined) { cur.tasks[+e.target.dataset.t].done = e.target.checked; renderSub(); }
  const d = e.target.closest('[data-dt]'); if (d) { cur.tasks.splice(+d.dataset.dt, 1); renderSub(); }
});
$('#tn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#ta').click(); } });
$('#rn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#ra').click(); } });

f.addEventListener('submit', async e => {
  e.preventDefault();
  const p = { ...cur, title: f.title.value.trim(), client: f.client.value.trim(), status: f.status.value,
    deadline: f.deadline.value || null, value: +f.value.value || 0, paid: +f.paid.value || 0,
    brief: f.brief.value, links: f.links.value,
    items: cur.items.filter(i => i.name.trim() || +i.price).map(i => ({ ...i, name: i.name.trim() })), design_fee: +f.design_fee.value || 0 };
  if (p.items.length || p.design_fee) p.value = p.items.reduce((a, i) => a + itemSub(i), 0) + p.design_fee;
  if (!p.id) delete p.id;
  try { await db.save(p); dlg.close(); render(); } catch (err) { alert('Gagal menyimpan: ' + err.message); }
});
$('#del').onclick = async () => {
  if (!confirm('Hapus proyek ini? Tindakan ini tidak bisa dibatalkan.')) return;
  try { await db.del(cur.id); dlg.close(); render(); } catch (err) { alert(err.message); }
};

// ---- PWA: status koneksi, tombol pasang, service worker ----
const setNet = () => { $('#net').hidden = navigator.onLine; };
addEventListener('offline', setNet);
addEventListener('online', () => { setNet(); if (sb && !$('#app').hidden) refresh(); });
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#inst').hidden = false; });
$('#inst').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#inst').hidden = true; };
addEventListener('appinstalled', () => { $('#inst').hidden = true; });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

// ---- auth & start ----
async function refresh() { try { projects = await db.load(); render(); } catch (err) { console.error(err); } }
async function start(email) {
  try { projects = await db.load(); } catch (err) { alert('Gagal memuat data: ' + err.message); }
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#who').textContent = email;
  setNet();
  paintIcons(); render();
}
$('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('#auth').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return;
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  error ? alert('Login gagal: ' + error.message) : start(data.user.email);
});
// sinkron antar perangkat: muat ulang data saat tab kembali dibuka
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden && !dlg.open) refresh(); });
(async () => {
  paintIcons();
  if (!(await initCloud())) { if (!navigator.onLine) $('#cfg').textContent = 'Tidak ada koneksi internet. Sambungkan lalu muat ulang halaman.'; $('#cfg').hidden = false; $('#auth').hidden = false; return; }
  const { data } = await sb.auth.getSession();
  data.session ? start(data.session.user.email) : $('#auth').hidden = false;
})();
</script>
</body>
</html>
